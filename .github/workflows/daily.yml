name: daily-cycle

# After the US equity close: collect listings, rebuild the index, run the
# local futures paper cycle and the claim 1-3 evaluation, then claim 4
# (evaluation, then the daily step: shadow log, or Alpaca PAPER orders only
# if the pre-registered gate passes), and the shadow log of exploration
# candidates (forecasts only, never an order). Commit the new raw data and
# dated reports and push.
#
# 23:37 UTC is after the US close in daylight and standard time, after
# gpurentalprices.com's daily refresh, and after the 23:30 UTC cutoff that
# claim 4's timing assumes (docs/decisions.md D31). Weekend runs collect
# listings; claim 4 defers to the last run before each session's open.
#
# Scheduled workflows run on the default branch only.

on:
  schedule:
    - cron: "37 23 * * *"
  workflow_dispatch:
    inputs:
      skip_claim4:
        description: "Skip the claim-4 steps (collection and claims 1-3 still run)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-cycle
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Paper endpoint only. Every Alpaca client refuses anything else (D30).
      APCA_API_BASE_URL: https://paper-api.alpaca.markets
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      # Set the repository variable COMPUTE_CURVE_KILL_SWITCH to 1 to close all
      # claim-4 paper positions and block orders without a code change.
      COMPUTE_CURVE_KILL_SWITCH: ${{ vars.COMPUTE_CURVE_KILL_SWITCH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"

      - name: Install
        run: uv sync --frozen

      - name: Collect listings, rebuild the index, run the local paper cycle
        id: collect
        continue-on-error: true
        run: uv run compute-curve daily

      - name: Evaluate claims 1-3
        id: evaluate
        continue-on-error: true
        run: uv run compute-curve evaluate

      - name: Offline tests (gate the claim-4 steps)
        id: tests
        continue-on-error: true
        run: uv run pytest -q

      - name: Exploration round 1 candidates (shadow forecasts only, no orders)
        id: xshadow
        if: ${{ steps.tests.outcome == 'success' }}
        continue-on-error: true
        run: uv run compute-curve explore round1 shadow

      - name: Exploration round 2 confirmations (run once each when data is complete)
        id: xconfirm2
        if: ${{ steps.tests.outcome == 'success' }}
        continue-on-error: true
        run: uv run compute-curve explore round2 confirmation

      - name: Exploration round 3 confirmation (runs once when the CGI window is complete)
        id: xconfirm3
        if: ${{ steps.tests.outcome == 'success' }}
        continue-on-error: true
        run: uv run compute-curve explore round3 confirmation

      - name: Exploration round 4 forward replication of H01 (runs once after 2026-12-31)
        id: xconfirm4
        if: ${{ steps.tests.outcome == 'success' }}
        continue-on-error: true
        run: uv run compute-curve explore round4 confirmation && uv run compute-curve explore round4 r402

      - name: Claim 4 evaluation and validation gate
        id: c4eval
        if: ${{ steps.tests.outcome == 'success' && !inputs.skip_claim4 }}
        continue-on-error: true
        run: uv run compute-curve claim4 evaluate

      - name: Claim 4 daily cycle (shadow log, or gated paper orders)
        id: c4daily
        if: ${{ steps.c4eval.outcome == 'success' }}
        continue-on-error: true
        run: uv run compute-curve claim4 daily

      - name: Claim 6c stat-arb forward shadow test (evaluates once after 60 sessions; no orders)
        id: sa_forward
        if: ${{ steps.tests.outcome == 'success' && !inputs.skip_claim4 }}
        continue-on-error: true
        run: uv run compute-curve statarb forward

      - name: Claim 6c SA2-M extended forward test (evaluates once after 250 sessions; no orders)
        id: sa_forward_ext
        if: ${{ steps.tests.outcome == 'success' && !inputs.skip_claim4 }}
        continue-on-error: true
        run: uv run compute-curve statarb forward-extended

      - name: SA2-M practice sheet for the next session (weights only; no orders)
        id: sa_signals
        if: ${{ steps.tests.outcome == 'success' && !inputs.skip_claim4 }}
        continue-on-error: true
        run: uv run compute-curve statarb signals

      - name: SA2-M Alpaca PAPER orders for the next open (fake money; D63; kill switches)
        id: sa_paper
        if: ${{ steps.tests.outcome == 'success' && !inputs.skip_claim4 }}
        continue-on-error: true
        run: uv run compute-curve statarb paper

      - name: Claim 10 strategy lab, MX1-MX4 forward shadow next to SA2-M (no orders)
        id: sa_lab
        if: ${{ steps.tests.outcome == 'success' && !inputs.skip_claim4 }}
        continue-on-error: true
        run: uv run compute-curve statarb lab

      - name: Claim 7 futures premium shadow log (derived numbers only; no orders)
        id: fp_shadow
        if: ${{ always() }}
        continue-on-error: true
        run: uv run compute-curve futures-premium

      - name: Claim 8 GPU2/GPU1 spread shadow (derived numbers only; no orders)
        id: sp_shadow
        if: ${{ always() }}
        continue-on-error: true
        run: uv run compute-curve spread

      - name: GPU1/GPU2 balance-of-month fair value sheet and FP-C (no orders)
        id: fair_value
        if: ${{ always() }}
        continue-on-error: true
        run: uv run compute-curve fair-value

      - name: Claim 9 Kalshi GPU binaries (public market data; no orders)
        id: kalshi
        if: ${{ always() }}
        continue-on-error: true
        run: uv run compute-curve kalshi

      - name: FP-D long-the-backwardation shadow (no orders)
        id: carry
        if: ${{ always() }}
        continue-on-error: true
        run: uv run compute-curve carry

      - name: FP-K GPU1 vs Kalshi H100 monthly average shadow (no orders)
        id: crossvenue
        if: ${{ always() }}
        continue-on-error: true
        run: uv run compute-curve crossvenue

      - name: Commit and push data and reports
        if: ${{ always() }}
        run: |
          git config user.name "compute-curve-bot"
          git config user.email "compute-curve-bot@users.noreply.github.com"
          git add data/raw data/collection_log.jsonl reports
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Daily cycle $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4; do
            if git pull --rebase --quiet && git push --quiet; then exit 0; fi
            sleep $((attempt * 15))
          done
          echo "Push failed after 4 attempts." >&2
          exit 1

      - name: Fail the run if any step failed
        if: ${{ always() }}
        run: |
          failed=0
          for s in "collect:${{ steps.collect.outcome }}" "evaluate:${{ steps.evaluate.outcome }}" \
                   "tests:${{ steps.tests.outcome }}" "claim4-evaluate:${{ steps.c4eval.outcome }}" \
                   "claim4-daily:${{ steps.c4daily.outcome }}" \
                   "explore-shadow:${{ steps.xshadow.outcome }}" \
                   "explore2-confirm:${{ steps.xconfirm2.outcome }}" \
                   "explore3-confirm:${{ steps.xconfirm3.outcome }}" \
                   "explore4-confirm:${{ steps.xconfirm4.outcome }}" \
                   "statarb-forward:${{ steps.sa_forward.outcome }}" \
                   "statarb-forward-ext:${{ steps.sa_forward_ext.outcome }}" \
                   "statarb-signals:${{ steps.sa_signals.outcome }}" \
                   "statarb-paper:${{ steps.sa_paper.outcome }}" \
                   "statarb-lab:${{ steps.sa_lab.outcome }}" \
                   "futures-premium:${{ steps.fp_shadow.outcome }}" \
                   "spread:${{ steps.sp_shadow.outcome }}" \
                   "fair-value:${{ steps.fair_value.outcome }}" \
                   "kalshi:${{ steps.kalshi.outcome }}" \
                   "carry:${{ steps.carry.outcome }}" \
                   "crossvenue:${{ steps.crossvenue.outcome }}"; do
            name="${s%%:*}"; outcome="${s#*:}"
            echo "$name: ${outcome:-skipped}"
            if [ "$outcome" = "failure" ]; then failed=1; fi
          done
          if [ "${{ steps.tests.outcome }}" = "failure" ]; then
            echo "Tests failed, so the claim-4 and exploration steps were skipped." >&2
          fi
          exit $failed
