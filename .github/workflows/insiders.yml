name: insider-tracker

# Each weekday morning, before the US open: read SEC EDGAR's daily form index
# for the last unprocessed weekdays, keep Form 4 open-market purchases, flag
# insider clusters and C-suite buys, commit the purchases and the report, and
# open a GitHub issue (which notifies the repository owner) when anything is
# flagged. Research and alerts only; nothing trades (docs/decisions.md D69).
#
# SEC requires a declared User-Agent with a contact email. Set the repository
# variable SEC_USER_AGENT to e.g. "Your Name you@example.com" (Settings ->
# Secrets and variables -> Actions -> Variables). Until it is set, the run
# fails with a clear message and nothing is fetched.
#
# 11:17 UTC is 07:17 ET in daylight time (06:17 in standard time): after
# EDGAR publishes the previous day's index, before the 09:30 ET open.

on:
  schedule:
    - cron: "17 11 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: insider-tracker
  cancel-in-progress: false

jobs:
  insiders:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"

      - name: Install
        run: uv sync --frozen

      - name: Scan SEC Form 4 filings
        run: uv run compute-curve insiders

      - name: Open an alert issue
        run: |
          if [ ! -s reports/insiders/alert.md ]; then
            echo "no alerts"
            exit 0
          fi
          gh label create insider-alert --color FBCA04 \
            --description "Insider buying flagged by the tracker" --force
          gh issue create \
            --title "Insider buying alert $(date -u +%Y-%m-%d)" \
            --label insider-alert \
            --body-file reports/insiders/alert.md

      - name: Commit purchases and reports
        if: ${{ always() }}
        run: |
          rm -f reports/insiders/alert.md
          git config user.name "compute-curve-bot"
          git config user.email "compute-curve-bot@users.noreply.github.com"
          git add data/raw/insiders reports/insiders 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Insider tracker $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4; do
            if git pull --rebase --quiet && git push --quiet; then exit 0; fi
            sleep $((attempt * 15))
          done
          exit 1
