# compute-curve default configuration.
#
# Any value marked `verified = false` or annotated ASSUMPTION is not a
# finding. Reports print these assumptions next to every result.

[project]
seed = 20261005
data_dir = "data"
var_dir = "var"
reports_dir = "reports"

[http]
user_agent = "compute-curve-research/0.1 (non-commercial research)"
min_interval_s = 2.0      # minimum seconds between requests to the same host
timeout_s = 30.0
max_retries = 2

[collectors]
# Only sources approved in docs/data_sources.md.
enabled = ["cgi", "getdeploying", "gpurentalprices", "lium", "nebius", "lambda", "coreweave", "hyperstack", "verda"]
# Terms prohibit automated collection or index use (docs/data_sources.md).
excluded_providers = ["vast", "runpod"]
# Sources that require a data licence; add one only after a licence is held.
licensed = []

[signals]
# A signal places paper orders only if it is listed here AND has been
# validated out of sample (var/validation.json). Otherwise it runs in shadow
# mode: predictions are logged for later evaluation, no orders are placed.
trade = ["nowcast", "relative_value"]
nowcast_size = 1
nowcast_edge_multiple = 2.0
rv_size_gpu2 = 1
rv_contract_offset = 1

# ---------------------------------------------------------------------------
# Contract specifications, from NYMEX Submission 26-370 to the CFTC (filed
# 2026-08-11) and Exhibit B. cmegroup.com itself could not be read
# (docs/blockers.md B2). Fields listed in `verified_fields` were checked
# against those primary documents; every other number is an assumption.
# Status 2026-10-05: NOT trading. The CFTC extended its 40.3 review to
# 2026-11-09 (docs/contract_specs.md).
# ---------------------------------------------------------------------------
[contracts.GPU1]
product = "GPU1"
gpu_model = "H100"
underlying_index = "Silicon Data H100 Rental Index"
gpu_hours_per_contract = 730.0
listed_months = 36
tick_size = 0.01                       # USD 0.01/GPU-h = USD 7.30 per contract
settlement_days = "business"           # average over Business Days of the month
exchange_fee_per_contract = 5.50       # Globex non-member, per side
cash_settlement_fee_per_contract = 1.35  # non-member
initial_margin_per_contract = 400.0    # ASSUMPTION: not published; ~20% of notional at ~USD 2.8
listing_status = "not listed: CFTC 40.3 review extended to 2026-11-09"
verified_fields = ["gpu_hours_per_contract", "listed_months", "tick_size", "settlement_days", "exchange_fee_per_contract", "cash_settlement_fee_per_contract"]
sources = ["https://www.cftc.gov/filings/ptc/ptc08112615405.pdf", "https://www.cftc.gov/filings/ptc/ptc08112615406.xlsx", "https://www.cftc.gov/filings/documents/2026/orgdcmnymexcompcontr260921.pdf"]
notes = "NYMEX Chapter 1045. Floating price: arithmetic average of SD-H100 on-demand settlement prices for each Business Day; index configuration Geography: United States. Missing-day fallback not specified."

[contracts.GPU2]
product = "GPU2"
gpu_model = "B200"
underlying_index = "Silicon Data B200 Rental Index"
gpu_hours_per_contract = 730.0
listed_months = 36
tick_size = 0.01
settlement_days = "business"
exchange_fee_per_contract = 5.50
cash_settlement_fee_per_contract = 1.35
initial_margin_per_contract = 900.0    # ASSUMPTION: not published; ~20% of notional at ~USD 5.9
listing_status = "not listed: CFTC 40.3 review extended to 2026-11-09"
verified_fields = ["gpu_hours_per_contract", "listed_months", "tick_size", "settlement_days", "exchange_fee_per_contract", "cash_settlement_fee_per_contract"]
sources = ["https://www.cftc.gov/filings/ptc/ptc08112615405.pdf", "https://www.cftc.gov/filings/ptc/ptc08112615406.xlsx", "https://www.cftc.gov/filings/documents/2026/orgdcmnymexcompcontr260921.pdf"]
notes = "NYMEX Chapter 1047. Same terms as GPU1 on SD-B200."

[index]
method = "provider_weighted_median"   # pre-registered primary method
trim_fraction = 0.1                   # used only by the trimmed_mean variant
min_providers = 3
min_listings = 5
terms = ["on_demand"]
exclude_providers = ["aws", "azure", "gcp", "oci"]   # hyperscalers: index is neocloud-only
allowed_regions = ["US", "NA"]                       # contract: "Geography: United States"
include_unknown_region = true                        # most sources state no region
history_sources = ["gpurentalprices_hist", "gpurentalprices"]  # balanced-panel history series
history_min_presence = 0.9
source_priority = ["lambda", "coreweave", "nebius", "hyperstack", "verda", "lium", "gpurentalprices", "gpurentalprices_hist", "cgi"]

[index.variants]
H100 = ["SXM", "PCIE", "NVL", "NVLINK", "UNKNOWN"]
B200 = ["SXM", "UNKNOWN"]

# Conservative default trading costs for a thin, newly listed market.
[costs]
half_spread_ticks = 5.0     # ASSUMPTION: USD 0.05/GPU-h each way; wide for a new contract
slippage_ticks = 2.0        # ASSUMPTION
broker_clearing_fee_per_contract = 2.50  # ASSUMPTION: added to the verified exchange fee
sensitivity_multipliers = [0.0, 0.5, 1.0, 2.0, 4.0]

[risk]
starting_cash = 100000.0
max_contracts_per_month = 5
max_gross_contracts = 10
daily_loss_limit = 2000.0
max_drawdown = 7500.0
halt_days_after_daily_breach = 1

[nowcast]
min_training_months = 6
min_days_observed = 1
publication_lag_days = 1    # ASSUMPTION: index value for day d usable from d+1

[schwartz_smith]
dt_years = 0.0027397260273972603   # 1/365
min_observations = 180
jump_mean_prior = 0.0
jump_std_prior = 0.15
depreciation_rate_prior = 0.20     # ASSUMPTION: prior only, never reported as a finding

[relative_value]
# ASSUMPTION: B200/H100 throughput ratio from NVIDIA spec sheets (dense FP8 and
# BF16 tensor throughput, HBM bandwidth all near 2.3x). Workload dependent.
perf_ratio_b200_over_h100 = 2.3
perf_ratio_low = 1.8
perf_ratio_high = 3.0
perf_ratio_source = "NVIDIA H100 and B200 datasheets; see docs/relative_value.md"
zscore_window_days = 60
entry_z = 2.0
exit_z = 0.5

[bootstrap]
n_boot = 2000
block_length = 5
confidence = 0.95

# Hardware launch windows ([[launches]] entries) are appended below from
# docs/hardware_launches.md once sourced.
