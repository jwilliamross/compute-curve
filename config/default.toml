window_start = 2026-08-26
affects = ["H100", "B200"]
kind = "volume_shipments"
source = "https://nvidianews.nvidia.com/news/nvidia-announces-financial-results-for-second-quarter-fiscal-2027"

[[launches]]
name = "Rubin Ultra systems (announced for second half of 2027)"
window_start = 2027-07-01
affects = ["H100", "B200"]
kind = "announced"
source = "https://blogs.nvidia.com/blog/nvidia-keynote-at-gtc-2025-ai-news-live-updates/"

# ---------------------------------------------------------------------------
# Claim 4: do changes in our index lead compute-linked equities?
# Pre-registered in docs/claim4_plan.md on 2026-10-06, before any test-window
# return was seen. Changing a value here after results exist is a new variant
# (docs/variants_log.md). Cost and risk numbers are ASSUMPTIONS.
# ---------------------------------------------------------------------------
[claim4]
benchmark = "XLK"
first_session = 2026-08-20          # first session whose signal uses only post-formation index days
bars_start = 2026-06-01             # first bar fetched (pre-sample window for the liquidity rule)
horizons = [1, 5, 20]
signals = ["level_h100", "level_b200", "disp_h100", "disp_b200", "avail_h100", "avail_b200"]
feed = "sip"
adjustment = "all"
availability_margin_minutes = 60    # D31
daily_cutoff_utc = "23:30"          # D31: when the live cycle runs
open_buffer_minutes = 5
min_bucket_coverage = 0.5
event_threshold = 0.02
min_events = 10
min_nonzero_signal = 10
min_train = 20
alpha = 0.05
fdr_q = 0.10
min_oos_forecasts = 120
min_oos_nonzero = 30
max_index_age_days = 3
paper_start = 2026-10-06            # paper P&L, peaks and drawdown are measured from here

[claim4.universe]
neocloud = ["CRWV", "NBIS", "IREN", "WYFI"]
gpu_semis = ["NVDA", "AMD", "AVGO", "TSM", "MU", "MRVL", "SMCI", "CBRS"]
power_capacity = ["VST", "CEG", "TLN", "VRT", "BE", "APLD", "CORZ", "CIFR", "WULF"]

[claim4.panels]
# Frozen from the first 30 days of the history series (2026-07-19 to 2026-08-17).
H100 = ["coreweave", "crusoe", "digitalocean", "gmicloud", "hyperstack", "jarvislabs", "lambda", "latitude", "massedcompute", "nebius", "ovh", "primeintellect", "scaleway", "spheron", "tensordock", "thundercompute", "together", "verda", "voltagepark"]
B200 = ["coreweave", "gmicloud", "hyperstack", "lambda", "nebius", "primeintellect", "together", "verda"]

[claim4.costs]
stock_side_bps = 15.0               # ASSUMPTION: half-spread + slippage per side, universe stocks
benchmark_side_bps = 3.0            # ASSUMPTION: same for XLK
sell_fee_bps = 1.0                  # ASSUMPTION: SEC + FINRA fees on sells
commission_per_order = 0.0          # ASSUMPTION: Alpaca stock pricing, not re-verified
stock_borrow_annual = 0.05          # ASSUMPTION
benchmark_borrow_annual = 0.005     # ASSUMPTION
sensitivity_multipliers = [0.0, 0.5, 1.0, 2.0, 4.0]

[claim4.risk]
pair_notional_usd = 10000.0         # per leg at full position
max_position_usd = 10000.0          # per symbol, absolute market value
max_gross_exposure_usd = 20000.0
daily_loss_limit_usd = 1000.0
max_drawdown_usd = 3000.0
halt_sessions_after_daily_breach = 1
kill_switch = false                 # true closes all claim-4 positions and blocks orders

# ---------------------------------------------------------------------------
# Claim 5: do AWS GPU spot prices lead compute-linked equities?
# Pre-registered in docs/claim5_plan.md. Signal data: Zenodo "AWS Spot Price
# History" (Eric Pauley, UW-Madison), record 23082767, CC BY 4.0. Universe,
# benchmark, costs, risk limits and gate thresholds are claim 4's ([claim4]).
# ---------------------------------------------------------------------------
[claim5]
zenodo_record = 23082767
# Months the pre-registered sample needs (2026-03 to 2026-06 are absent from the dataset).
months = ["2024-10", "2024-11", "2024-12", "2025-01", "2025-02", "2025-03", "2025-04", "2025-05", "2025-06", "2025-07", "2025-08", "2025-09", "2025-10", "2025-11", "2025-12", "2026-01", "2026-02", "2026-07", "2026-08", "2026-09"]
gpu_classes = ["A100", "H100"]      # classes that become signals
cutoff_utc = "23:30"                # price in effect at this time is the day's value (D31)
availability_margin_minutes = 60
max_age_days = 1                    # data cover every calendar day; an older day means a gap -> no signal
min_pools = 3                       # matched pools needed for a signal value
first_session = 2024-10-21          # first session the category-balanced basket can exist (NBIS resumes)
signals = ["level_a100", "level_h100", "disp_a100", "disp_h100"]
bars_start = 2024-09-01

[claim5.member_start]
# A member's returns are used only from this date (business before it differs).
NBIS = 2024-10-21                   # Yandex N.V. until 2024; Nasdaq trading resumed 2024-10-21

# ---------------------------------------------------------------------------
# Exploration round 1 (docs/exploration_plan.md). Fixed before any analysis.
# Each dataset is split by time: earliest 70% exploration, latest 30%
# confirmation. Ranges are inclusive; CGI ranges are UTC timestamps.
# ---------------------------------------------------------------------------
[exploration]
round = 1
n_boot = 2000
fdr_q = 0.10                 # Benjamini-Hochberg across the round's 12 tests
perm_alpha = 0.05            # circular-shift or sign-flip robustness check
confirm_alpha = 0.05         # one-sided, Holm across the confirmed hypotheses
max_confirm = 3
forward_sessions = 60        # future US equity sessions a candidate must pass first
min_nonzero = 10             # non-zero signal values
min_events = 5               # distinct periods with a one-period change in the signal
min_cross_sections = 20      # H01: daily cross-sections
min_cs_providers = 5         # H01: providers per cross-section
echo_min_t = 1.0             # partial slope |t| after removing the target's own past change
leaders = ["coreweave", "lambda", "nebius", "crusoe", "together"]
min_group_providers = 3
min_spot_providers = 2
min_pools = 3
cgi_max_age_minutes = 30

[exploration.splits.listings]
explore = [2026-07-19, 2026-09-12]
confirm = [[2026-09-13, 2026-10-06]]

[exploration.splits.cgi]
explore = [2026-08-30T00:00:00Z, 2026-09-24T23:45:00Z]
confirm = [[2026-09-25T00:00:00Z, 2026-10-05T23:45:00Z]]

[exploration.splits.getdeploying]
explore = [2025-10-06, 2026-06-15]
confirm = [[2026-06-22, 2026-10-05]]

[exploration.splits.aws]
explore = [2024-10-01, 2025-11-30]
confirm = [[2025-12-01, 2026-02-28], [2026-07-01, 2026-09-30]]

[exploration.splits.equities]
explore = [2024-09-03, 2026-02-19]
confirm = [[2026-02-20, 2026-10-05]]

# Forward test of round-1 candidates, shadow mode only (docs/exploration_plan.md
# section 9). H05 passed confirmation on 2026-10-06. Its 60 future US equity
# sessions run from 2026-10-07 to 2026-12-31 (NYSE closed 2026-11-26 and
# 2026-12-25); every hourly decision point in that window counts.
[exploration.forward.H05]
start = 2026-10-07T00:00:00Z
end = 2026-12-31T23:59:59Z
sessions = 60
max_publish_lag_minutes = 15    # a value published later than this is not point-in-time

# Exploration round 2 (docs/exploration_round2_plan.md). Round 1's split dates
# stay fixed; confirmation sets spent in round 1 are replaced by future data.
[exploration2]
cgi_confirm = [2026-10-10T00:00:00Z, 2026-12-31T23:59:59Z]
aws_confirm_months = ["2026-10", "2026-11", "2026-12"]
min_train = 60                      # R2-04: pairs before the first walk-forward forecast
min_oos = 120                       # R2-04: out-of-sample forecasts needed
min_provider_change_windows = 10    # R2-02: windows with a CGI provider-count change
